services:
  server:
    # Build context is the repo root (one level up) so the Dockerfile's `COPY . .`
    # sees go.mod and the source; the Dockerfile itself lives here under container/.
    build:
      context: ..
      dockerfile: container/Dockerfile
    image: core-server
    ports:
      - "8080:8080"
    volumes:
      - core-data:/data
    restart: unless-stopped
    # Override the server flags here if needed (replaces the image CMD).
    # Keep the in-container port at 8080 so the Dockerfile HEALTHCHECK matches.
    # command: ["-addr", ":8080", "-store", "/data/kv.core", "-shards", "16"]
    #
    # The HEALTHCHECK is inherited from the Dockerfile; uncomment to tune it:
    # healthcheck:
    #   test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
    #   interval: 30s
    #   timeout: 3s
    #   start_period: 5s
    #   retries: 3

volumes:
  core-data:
